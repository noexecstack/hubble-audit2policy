[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hubble-audit2policy"
version = "0.4.0"
description = "Generate least-privilege CiliumNetworkPolicy YAML from Hubble flow logs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "noexecstack" }]
keywords = ["cilium", "hubble", "kubernetes", "network-policy", "security", "sre", "platform-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
hubble-audit2policy = "hubble_audit2policy:main"

[project.urls]
Homepage = "https://github.com/noexecstack/hubble-audit2policy"
Issues = "https://github.com/noexecstack/hubble-audit2policy/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "SIM102",   # nested-if — clearer than combined conditions in flow parsing
    "SIM105",   # contextlib.suppress — try/except/pass is idiomatic for curses
    "SIM108",   # ternary — multi-line if/else is more readable for assignments
    "SIM115",   # open-in-with — capture file handle managed by finally block
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
