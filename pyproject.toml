[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hubble-audit2policy"
version = "0.3.0"
description = "Generate least-privilege CiliumNetworkPolicy YAML from Hubble flow logs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "noexecstack" }]
keywords = ["cilium", "hubble", "kubernetes", "network-policy", "security", "sre", "platform-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
hubble-audit2policy = "hubble-audit2policy:main"

[project.urls]
Homepage = "https://github.com/noexecstack/hubble-audit2policy"
Issues = "https://github.com/noexecstack/hubble-audit2policy/issues"
